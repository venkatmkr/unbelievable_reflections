<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Unbelievable Reflections – Smart Mirror</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0d12;--card:#151924;--fg:#e8ecf4;--good:#4ade80;--mild:#facc15;--poor:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;height:100vh}
main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
canvas{max-width:100%;max-height:100vh;border-radius:12px}video{display:none}
#status{position:absolute;top:16px;left:16px;color:#aab}
aside{width:340px;background:var(--card);padding:16px;overflow:auto}
#tabs{display:flex;gap:6px;margin-bottom:12px}
button{background:#222a3a;color:var(--fg);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
#tabs button{flex:1;text-align:center}button.on{background:#4f46e5}
#panel button{display:block;width:100%;margin:6px 0}
.score{font-size:54px;font-weight:700;text-align:center}.score small{font-size:16px;opacity:.6}
.good{color:var(--good)}.mild{color:var(--mild)}.poor{color:var(--poor)}
.row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:8px;background:#222a3a;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;transition:width .2s}
.bar i.good{background:var(--good)}.bar i.mild{background:var(--mild)}.bar i.poor{background:var(--poor)}
.recs p{font-size:13px;background:#1c2232;padding:8px;border-radius:8px}.muted{opacity:.6;font-size:12px}
.file input{display:block;margin-top:6px}
</style></head>
<body>
<main><video id="cam" playsinline muted></video><canvas id="view"></canvas><div id="status"></div></main>
<aside><div id="tabs"></div><div id="panel"></div></aside>
<script type="module" src="src/app.js"></script>
</body></html>
